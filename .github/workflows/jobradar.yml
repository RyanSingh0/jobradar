name: jobradar
on:
  schedule:
    # All lanes run Monday to Friday only, New York time (GitHub handles daylight saving through the timezone key).
    # Nothing runs on Saturday or Sunday: the last sweep is Friday 10pm ET, the first is Monday 12am ET.
    # Minute 7 instead of :00 because GitHub delays or drops scheduled runs at the top of the hour under load.
    - cron: "7 8-18 * * 1-5"       # fast lane: hourly, 8am-6pm ET (11 sweeps)
      timezone: "America/New_York"
    - cron: "7 20,22,0,2,4,6 * * 1-5"  # fast lane: every 2 h, 8pm-8am ET (6 sweeps; 8am is the first daytime run)
      timezone: "America/New_York"
    - cron: "45 */6 * * 1-5"       # slow lane: Workable boards (rate-limited), every 6 h
      timezone: "America/New_York"
    - cron: "20 */6 * * 1-5"       # paid lane: fantastic.jobs feed, every 6 h (does nothing until APIFY_TOKEN is set)
      timezone: "America/New_York"
  workflow_dispatch: {}            # "Run workflow" button = manual sweep
permissions:
  contents: write
concurrency:
  group: jobradar                  # one sweep at a time so state.json never conflicts
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: sweep
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERTS_IMAP_USER: ${{ secrets.ALERTS_IMAP_USER }}
          ALERTS_IMAP_PASSWORD: ${{ secrets.ALERTS_IMAP_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FANTASTIC_LIMIT: ${{ vars.FANTASTIC_LIMIT || '60' }}
        run: |
          case "${{ github.event.schedule }}" in
            "45 */6 * * 1-5") python jobradar.py --only workable --delay 4 ;;
            "20 */6 * * 1-5") if [ -n "$APIFY_TOKEN" ]; then python jobradar.py --only fantastic --hours 10; else echo "paid lane off"; fi ;;
            *)              python jobradar.py --skip workable ;;
          esac
      - name: save state and today's files
        run: |
          git config user.name jobradar && git config user.email jobradar@users.noreply.github.com
          git add state.json out/ || true
          git commit -q -m "sweep $(date -u +%FT%H:%M)" || exit 0
          git pull -q --rebase && git push -q
