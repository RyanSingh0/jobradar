name: jobradar
on:
  schedule:
    - cron: "*/30 10-23 * * 1-5"   # fast lane: every 30 min, about 6am-8pm ET on weekdays (GitHub cron is UTC)
    - cron: "0 0-3 * * 2-6"        # fast lane: hourly, about 8pm-11pm ET on weekday evenings
    - cron: "0 */3 * * 0,6"        # fast lane: every 3 h at weekends
    - cron: "45 */6 * * *"         # slow lane: Workable boards (rate-limited), every 6 h
    - cron: "20 */6 * * *"         # paid lane: fantastic.jobs feed, every 6 h (does nothing until APIFY_TOKEN is set)
  workflow_dispatch: {}            # "Run workflow" button = manual sweep
permissions:
  contents: write
concurrency:
  group: jobradar                  # one sweep at a time so state.json never conflicts
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: sweep
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERTS_IMAP_USER: ${{ secrets.ALERTS_IMAP_USER }}
          ALERTS_IMAP_PASSWORD: ${{ secrets.ALERTS_IMAP_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FANTASTIC_LIMIT: ${{ vars.FANTASTIC_LIMIT || '60' }}
        run: |
          case "${{ github.event.schedule }}" in
            "45 */6 * * *") python jobradar.py --only workable --delay 4 ;;
            "20 */6 * * *") if [ -n "$APIFY_TOKEN" ]; then python jobradar.py --only fantastic --hours 10; else echo "paid lane off"; fi ;;
            *)              python jobradar.py --skip workable ;;
          esac
      - name: save state and today's files
        run: |
          git config user.name jobradar && git config user.email jobradar@users.noreply.github.com
          git add state.json out/ || true
          git commit -q -m "sweep $(date -u +%FT%H:%M)" || exit 0
          git pull -q --rebase && git push -q
